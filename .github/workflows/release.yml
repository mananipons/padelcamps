name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -oP '^\s*\*\s*Version:\s+\K[0-9][0-9A-Za-z.\-]*' padelcamps.php)
          CONST=$(grep -oP "define\( 'PADELCAMPS_VERSION', '\K[^']+" padelcamps.php)
          echo "tag=$TAG header=$HEADER const=$CONST"
          if [ "$TAG" != "$HEADER" ] || [ "$TAG" != "$CONST" ]; then
            echo "::error::Tag v$TAG does not match padelcamps.php (Version: $HEADER, PADELCAMPS_VERSION: $CONST)"
            exit 1
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build ZIP
        run: |
          git archive --format=zip --prefix=padelcamps/ \
            -o "padelcamps-${{ steps.ver.outputs.version }}.zip" "$GITHUB_SHA"
          unzip -l "padelcamps-${{ steps.ver.outputs.version }}.zip" | tail -n 3

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE="padelcamps-${{ steps.ver.outputs.version }}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$FILE" \
              --title "PadelCamps ${{ steps.ver.outputs.version }}" \
              --generate-notes
          fi
